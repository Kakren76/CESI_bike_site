<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>CesiBike Poste 1</title>
    <link rel="stylesheet" href="../../../../css/global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Poste 1</h1>
        <p>Visualisation détaillée du poste de travail</p>
    </header>

    <nav>
        <a href="../../accueil/index.html">Accueil</a>
        <a href="../../configuration/index.html">Configuration</a>
        <a href="../ensemble/index.html">Vue d'ensemble</a>
    </nav>

    <main>

        <section class="card">
            <h2>État du stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pièce</th>
                        <th>Quantité restante</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>VIS XR33</td>
                        <td>55</td>
                    </tr>
                    <tr>
                        <td>Pédalier VR12</td>
                        <td>28</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section class="card">
            <h2>Temps d'assemblage par étape</h2>
            <table>
                <thead>
                    <tr>
                        <th>Étape</th>
                        <th>Temps (secondes)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Étape 1</td>
                        <td>120</td>
                    </tr>
                    <tr>
                        <td>Étape 2</td>
                        <td>140</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section class="card actions">
            <button>
                Passer à l'étape suivante
            </button>
        </section>

    </main>

    <footer>
        <p>Projet CesiBike Visualisation poste</p>
    </footer>

</body>

</html>
